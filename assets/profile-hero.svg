<svg width="1600" height="620" viewBox="0 0 1600 620" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="620" gradientUnits="userSpaceOnUse">
    <stop stop-color="#F8F8F5"/>
    <stop offset="0.58" stop-color="#F2F3EF"/>
    <stop offset="1" stop-color="#E9ECF3"/>
  </linearGradient>
  <linearGradient id="accent" x1="1050" y1="90" x2="1510" y2="540" gradientUnits="userSpaceOnUse">
    <stop stop-color="#625BFF"/>
    <stop offset="1" stop-color="#24C8A5"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#111827" flood-opacity=".12"/>
  </filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" stroke="#111827" stroke-opacity=".055"/>
  </pattern>
  <style>
    @keyframes heroFloat {
      0%,100% { transform: translate(990px,94px) rotate(3deg); }
      50% { transform: translate(990px,87px) rotate(2.4deg); }
    }
    @keyframes cursorFloat {
      0%,100% { transform: translate(1370px,460px) rotate(-12deg); opacity:.96; }
      50% { transform: translate(1378px,452px) rotate(-8deg); opacity:1; }
    }
    @keyframes glowPulse {
      0%,100% { opacity:.07; transform: scale(1); }
      50% { opacity:.13; transform: scale(1.06); }
    }
    @keyframes mintPulse {
      0%,100% { opacity:.07; transform: scale(1); }
      50% { opacity:.12; transform: scale(1.045); }
    }
    @keyframes accentSlide {
      0%,100% { transform: translateX(0); opacity:.9; }
      50% { transform: translateX(10px); opacity:1; }
    }
    @keyframes checkPop {
      0%,70%,100% { transform: scale(1); }
      78% { transform: scale(1.12); }
      86% { transform: scale(.96); }
    }
    @keyframes underline {
      0% { transform: scaleX(.35); transform-origin:left; opacity:.5; }
      45%,100% { transform: scaleX(1); transform-origin:left; opacity:1; }
    }
    .hero-browser { animation: heroFloat 7s ease-in-out infinite; transform-box: fill-box; }
    .hero-cursor { animation: cursorFloat 4.5s ease-in-out infinite; transform-box: fill-box; }
    .purple-glow { animation: glowPulse 6s ease-in-out infinite; transform-box: fill-box; transform-origin:center; }
    .mint-glow { animation: mintPulse 7s ease-in-out infinite 1s; transform-box: fill-box; transform-origin:center; }
    .accent-panel { animation: accentSlide 5s ease-in-out infinite; }
    .check { animation: checkPop 4s ease-in-out infinite 1s; transform-box: fill-box; transform-origin:center; }
    .hero-underline { animation: underline 2.2s cubic-bezier(.2,.8,.2,1) both; transform-box: fill-box; }
    @media (prefers-reduced-motion: reduce) {
      .hero-browser,.hero-cursor,.purple-glow,.mint-glow,.accent-panel,.check,.hero-underline { animation:none; }
    }
  </style>
</defs>

<rect width="1600" height="620" rx="28" fill="url(#bg)"/>
<rect width="1600" height="620" rx="28" fill="url(#grid)"/>

<circle class="purple-glow" cx="1375" cy="105" r="150" fill="#625BFF" fill-opacity=".07"/>
<circle class="mint-glow" cx="1510" cy="470" r="210" fill="#24C8A5" fill-opacity=".07"/>

<path d="M0 540C280 500 390 570 650 535C850 508 1000 420 1220 445C1380 463 1490 515 1600 500" stroke="#111827" stroke-opacity=".08" stroke-width="2"/>

<g transform="translate(92 86)">
  <rect x="0" y="0" width="8" height="8" rx="2" fill="#625BFF"/>
  <text x="25" y="9" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="3" fill="#4B5563">FRONTEND · INTERFACE · PRODUCT</text>

  <text x="0" y="125" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="800" letter-spacing="-3" fill="#111318">ROZHIN</text>
  <text x="0" y="205" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="800" letter-spacing="-3" fill="#111318">LAJEVARDI</text>

  <rect class="hero-underline" x="0" y="244" width="92" height="4" rx="2" fill="#625BFF"/>
  <text x="0" y="292" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" fill="#30343B">Frontend Developer · Web Designer</text>
  <text x="0" y="332" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#69707C">I turn thoughtful interfaces into clear, responsive, working products.</text>

  <g transform="translate(0 382)">
    <rect width="118" height="36" rx="18" fill="#111318"/>
    <text x="59" y="23" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#fff">NUXT · VUE</text>
    <rect x="130" width="135" height="36" rx="18" fill="#E4E6FF"/>
    <text x="197.5" y="23" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#4540A8">UI · UX · FIGMA</text>
    <rect x="277" width="116" height="36" rx="18" fill="#D9F8EE"/>
    <text x="335" y="23" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#147A65">JAVASCRIPT</text>
  </g>
</g>

<g class="hero-browser" filter="url(#shadow)">
  <g transform="rotate(3 1240 304)">
    <rect x="990" y="94" width="500" height="410" rx="24" fill="#FFFFFF"/>
    <rect x="990" y="94" width="500" height="52" rx="24" fill="#17191F"/>
    <rect x="990" y="121" width="500" height="25" fill="#17191F"/>
    <circle cx="1015" cy="120" r="5" fill="#FF6B6B"/>
    <circle cx="1033" cy="120" r="5" fill="#FFD166"/>
    <circle cx="1051" cy="120" r="5" fill="#63D9B3"/>
    <rect x="1078" y="111" width="180" height="18" rx="9" fill="#2A2D35"/>
    <rect x="1018" y="180" width="285" height="13" rx="6.5" fill="#111318" fill-opacity=".88"/>
    <rect x="1018" y="206" width="210" height="9" rx="4.5" fill="#111318" fill-opacity=".15"/>
    <rect x="1018" y="249" width="444" height="1" fill="#111318" fill-opacity=".08"/>
    <rect x="1018" y="278" width="205" height="150" rx="16" fill="#F1F2F6"/>
    <rect class="accent-panel" x="1241" y="278" width="221" height="70" rx="16" fill="url(#accent)" fill-opacity=".92"/>
    <rect x="1241" y="364" width="105" height="64" rx="16" fill="#111318"/>
    <rect x="1357" y="364" width="105" height="64" rx="16" fill="#E9EAFF"/>
    <circle class="check" cx="1381" cy="308" r="14" fill="#fff" fill-opacity=".85"/>
    <path d="M1374 308L1379 313L1389 301" stroke="#625BFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1040" y="298" width="120" height="12" rx="6" fill="#111318" fill-opacity=".13"/>
    <rect x="1040" y="322" width="145" height="8" rx="4" fill="#111318" fill-opacity=".07"/>
    <rect x="1040" y="348" width="110" height="8" rx="4" fill="#111318" fill-opacity=".07"/>
    <rect x="1018" y="450" width="150" height="18" rx="9" fill="#625BFF" fill-opacity=".13"/>
    <rect x="1180" y="450" width="105" height="18" rx="9" fill="#24C8A5" fill-opacity=".15"/>
  </g>
</g>

<g class="hero-cursor">
  <path d="M0 0L48 78L60 48L88 40L0 0Z" fill="#111318"/>
  <path d="M48 78L56 54L69 72L48 78Z" fill="#625BFF"/>
</g>

<text x="1480" y="580" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#6B7280">DESIGN → CODE → PRODUCT</text>
</svg>